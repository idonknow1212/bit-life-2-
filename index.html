<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitLife Game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Welcome to BitLife</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#career">Career</a></li>
                <li><a href="#love">Love</a></li>
                <li><a href="#shopping">Shopping</a></li>
                <li><a href="#status">Status</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Home</h2>
            <p>Welcome to your new life! Make the best choices.</p>
        </section>

        <section id="career">
            <h2>Career</h2>
            <p>Select a job from the list below:</p>
            <select id="job-select">
                <option value="">Choose your job</option>
                <option value="doctor">Doctor</option>
                <option value="engineer">Engineer</option>
                <option value="artist">Artist</option>
            </select>
            <button onclick="chooseJob()">Choose Job</button>
        </section>

        <section id="love">
            <h2>Love</h2>
            <p>Start a relationship and date others.</p>
            <button onclick="startDating()">Find a Partner</button>
        </section>

        <section id="shopping">
            <h2>Shopping</h2>
            <p>Buy homes and cars:</p>
            <ul>
                <li><button onclick="buyHome()">Buy a Home</button></li>
                <li><button onclick="buyCar()">Buy a Car</button></li>
            </ul>
        </section>

        <section id="status">
            <h2>Status</h2>
            <p>Your current status:</p>
            <div id="status-display"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 BitLife Game</p>
    </footer>
</body>
</html>
