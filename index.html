<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitLife Game</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; }
        #game { margin: auto; padding: 20px; background: white; border-radius: 8px; width: 600px; }
        h1 { text-align: center; }
        #stats, #actions, #log { margin: 10px 0; }
        button { margin: 5px; padding: 10px; }
    </style>
</head>
<body>
    <div id="game">
        <h1>BitLife Game</h1>
        <div id="stats">
            <p>Age: <span id="age">0</span></p>
            <p>Money: <span id="money">$0</span></p>
            <p>Happiness: <span id="happiness">0</span></p>
            <p>Health: <span id="health">100</span></p>
        </div>
        <div id="actions">
            <button onclick="ageUp()">Age Up</button>
            <button onclick="chooseCareer()">Choose Career</button>
            <button onclick="manageRelationships()">Manage Relationships</button>
            <button onclick="education()">Get Education</button>
            <button onclick="buyHome()">Buy Home</button>
            <button onclick="buyCar()">Buy Car</button>
            <button onclick="triggerEvent()">Random Event</button>
            <button onclick="saveGame()">Save Game</button>
            <button onclick="loadGame()">Load Game</button>
        </div>
        <div id="log">
            <h2>Life Log</h2>
            <ul id="lifeLog"></ul>
        </div>
    </div>
    <script>
        let age = 0, money = 0, happiness = 0, health = 100;
        const lifeLog = [];

        function ageUp() {
            age++;
            happiness -= 5;  // Aging decreases happiness
            health -= Math.floor(Math.random() * 5); // Random health loss
            log(`Aged up to ${age}`);
            updateStats();
        }

        function chooseCareer() {
            const careers = ['Doctor', 'Engineer', 'Artist', 'Teacher'];
            const career = careers[Math.floor(Math.random() * careers.length)];
            log(`Chose a career as a ${career}`);
            updateStats();
        }

        function manageRelationships() {
            log(`Managed relationships`);
            updateStats();
        }

        function education() {
            log(`Received a degree`);
            updateStats();
        }

        function buyHome() {
            money -= 50000; // Buying a home cost
            log(`Bought a home`);
            updateStats();
        }

        function buyCar() {
            money -= 20000; // Buying a car cost
            log(`Bought a car`);
            updateStats();
        }

        function triggerEvent() {
            const events = ['Won a lottery!', 'Had a health scare.', 'Got a promotion.'];
            const event = events[Math.floor(Math.random() * events.length)];
            log(event);
            updateStats();
        }

        function log(message) {
            lifeLog.push(message);
            updateLifeLog();
        }

        function updateLifeLog() {
            const logElement = document.getElementById('lifeLog');
            logElement.innerHTML = '';
            lifeLog.forEach(entry => {
                const li = document.createElement('li');
                li.textContent = entry;
                logElement.appendChild(li);
            });
        }

        function updateStats() {
            document.getElementById('age').textContent = age;
            document.getElementById('money').textContent = '$' + money;
            document.getElementById('happiness').textContent = happiness;
            document.getElementById('health').textContent = health;
        }

        function saveGame() {
            const gameData = { age, money, happiness, health, lifeLog };
            localStorage.setItem('bitlifeGame', JSON.stringify(gameData));
            log('Game saved!');
        }

        function loadGame() {
            const gameData = JSON.parse(localStorage.getItem('bitlifeGame'));
            if (gameData) {
                age = gameData.age;
                money = gameData.money;
                happiness = gameData.happiness;
                health = gameData.health;
                lifeLog.push(...gameData.lifeLog);
                updateStats();
                updateLifeLog();
                log('Game loaded!');
            } else {
                log('No saved game found.');
            }
        }
    </script>
</body>
</html>
